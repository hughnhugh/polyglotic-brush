# Licences and advisories for everything the engine is built from.
# The plan (polyglotic-hq 520, section 10): MIT, Apache-2.0, BSD, ISC, Zlib,
# Unicode only.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
]

# cbindgen (MPL-2.0) writes the C header in a test. It is a tool: no part of
# it is in the engine that ships.
[[licenses.exceptions]]
crate = "cbindgen"
allow = ["MPL-2.0"]

# Our own crates carry no SPDX licence: they are not published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
